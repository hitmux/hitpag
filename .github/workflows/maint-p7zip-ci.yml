name: maint-p7zip-ci

on:
  push:
    branches:
      - maint/p7zip-integration-fixes
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ xz-utils bzip2 unzip lz4 zstd
          sudo apt-get install -y p7zip-full || sudo apt-get install -y 7zip
      - name: Configure
        run: cmake -S . -B build -G Ninja -DHITPAG_FORCE_VENDORED_FTXUI=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
